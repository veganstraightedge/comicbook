name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    # Pinned: on Ubuntu 26.04 (what ubuntu-latest became) the seven-zip gem crashes Ruby reading an
    # empty 7z, and installing libvips-dev stalls.
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - "4.0.9"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unar libvips-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake
